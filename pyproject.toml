[project]
name = "DobotHub"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
camera = ["opencv-python"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "hardware: Requires a connected Dobot (only with --dobot)",
    "motion: Test moves the robot arm",
    "gripper: Requires the gripper to be mounted",
    "suction: Requires the suction to be mounted",
    "laser: Requires the laser to be mounted",
    "conveyor: Requires the conveyor belt",
    "ir: Requires the IR-Sensor (light barrier)",
    "color: Requires the color sensor",
]
